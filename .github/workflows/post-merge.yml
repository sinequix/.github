# Reusable post-merge automation for sinequix repos.
# On a merged PR: closes linked ClickUp tasks, comments on referenced GitHub
# issues, and deletes the head branch. Every outcome goes to the job summary;
# any failure fails the job.
name: post-merge (reusable)

on:
  workflow_call:
    inputs:
      clickup:
        description: Update ClickUp tasks (comment + closed status)
        type: boolean
        default: true
      delete_branch:
        description: Delete the head branch if it still exists
        type: boolean
        default: true
      runs_on:
        description: Runner label
        type: string
        default: ubuntu-latest
    secrets:
      CLICKUP_API_TOKEN:
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  post-merge:
    if: github.event.pull_request.merged == true
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    steps:
      - name: Post-merge
        env:
          GH_TOKEN: ${{ github.token }}
          CU_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DO_CLICKUP: ${{ inputs.clickup }}
          DO_DELETE: ${{ inputs.delete_branch }}
        shell: bash
        run: |
          # `shell: bash` is `bash -eo pipefail`. A grep with no match is a
          # normal result here; real failures are recorded in `fail`.
          set +e -uo pipefail
          fail=0
          out() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; echo "$*"; }
          bad() { out "- ❌ $*"; echo "::error::$*"; fail=1; }
          ok()  { out "- ✅ $*"; }
          out "## Post-merge ${REPO}#${PR_NUMBER}"
          out "Merge: \`${MERGE_SHA}\` · ${PR_URL}"
          text="$(printf '%s\n%s\n%s\n' "$PR_TITLE" "${PR_BODY:-}" "$HEAD_REF")"

          # ---------- ClickUp ----------
          out "### ClickUp"
          # Emits "id|team_id" (team_id only for custom IDs from /t/<team>/<id>).
          cu_ids() {
            printf '%s\n' "$text" | grep -oiE 'app\.clickup\.com/t/[0-9]+/[A-Za-z0-9_-]+' \
              | sed -E 's#.*/t/([0-9]+)/(.*)#\2|\1#'
            printf '%s\n' "$text" | grep -oiE 'app\.clickup\.com/t/[a-z0-9]+([^/A-Za-z0-9]|$)' \
              | sed -E 's#.*/t/([a-z0-9]+).*#\1|#' | tr '[:upper:]' '[:lower:]'
            printf '%s\n' "$text" | grep -oiE '(^|[^a-z0-9])CU-[a-z0-9]{6,12}' \
              | sed -E 's/.*CU-//I; s/$/|/' | tr '[:upper:]' '[:lower:]'
            printf '%s\n' "$text" | grep -i 'clickup' | grep -oiE '#[a-z0-9]{9}([^a-z0-9]|$)' \
              | grep -E '[a-z]' | grep -E '[0-9]' | sed -E 's/^#([a-z0-9]{9}).*/\1|/I' | tr '[:upper:]' '[:lower:]'
          }
          mapfile -t CU < <(cu_ids | sort -u)
          if [ "${DO_CLICKUP}" != "true" ]; then
            out "- skipped (clickup: false)"
          elif [ "${#CU[@]}" -eq 0 ]; then
            out "- no ClickUp task referenced"
          elif [ -z "${CU_TOKEN:-}" ]; then
            bad "CLICKUP_API_TOKEN not available; tasks not updated: ${CU[*]}"
          else
            api="https://api.clickup.com/api/v2"
            for entry in "${CU[@]}"; do
              id="${entry%%|*}"; team="${entry#*|}"
              q=""; [ -n "$team" ] && q="?custom_task_ids=true&team_id=${team}"
              task=$(curl -sS -f -H "Authorization: ${CU_TOKEN}" "${api}/task/${id}${q}") \
                || { bad "task ${id}: not found or no access"; continue; }
              list=$(jq -r '.list.id' <<<"$task"); cur=$(jq -r '.status.status' <<<"$task")
              statuses=$(curl -sS -f -H "Authorization: ${CU_TOKEN}" "${api}/list/${list}") \
                || { bad "task ${id}: cannot read list ${list} statuses"; continue; }
              target=$(jq -r '
                [.statuses[] | select(.type=="closed" or .type=="done")] as $s
                | ( [ $s[] | select(.status|ascii_downcase|test("^(complete|completed|done|hecha|hecho|cerrado|cerrada|mergeada|listo|closed)$")) ]
                    + [ $s[] | select(.type=="closed") ] + [ $s[] | select(.type=="done") ] )
                | (.[0].status // empty)' <<<"$statuses")
              msg="Merged ${PR_URL} (${REPO}@${MERGE_SHA:0:7}, ${MERGE_SHA})"
              curl -sS -f -o /dev/null -X POST -H "Authorization: ${CU_TOKEN}" -H 'Content-Type: application/json' \
                -d "$(jq -n --arg t "$msg" '{comment_text:$t, notify_all:false}')" "${api}/task/${id}/comment${q}" \
                || bad "task ${id}: comment failed"
              if [ -z "$target" ]; then
                bad "task ${id}: list ${list} has no closed/done status"
              elif [ "$(tr '[:upper:]' '[:lower:]' <<<"$cur")" = "$(tr '[:upper:]' '[:lower:]' <<<"$target")" ]; then
                ok "task ${id}: already '${target}', commented"
              elif curl -sS -f -o /dev/null -X PUT -H "Authorization: ${CU_TOKEN}" -H 'Content-Type: application/json' \
                     -d "$(jq -n --arg s "$target" '{status:$s}')" "${api}/task/${id}${q}"; then
                ok "task ${id}: '${cur}' → '${target}', commented"
              else
                bad "task ${id}: status update to '${target}' failed"
              fi
            done
          fi

          # ---------- GitHub issues ----------
          out "### GitHub issues"
          refs=$(printf '%s\n' "$text" | grep -oE '(^|[^A-Za-z0-9/_&#-])#[0-9]+\b' | grep -oE '[0-9]+' | sort -un)
          closing=$(printf '%s\n' "$text" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' | grep -oE '[0-9]+$' | sort -un)
          # shellcheck disable=SC2001
          [ -n "$closing" ] && out "- closing keywords (GitHub closes these natively when merged into the default branch): $(sed 's/^/#/' <<<"$closing" | paste -sd' ' -)"
          n_ref=0
          for n in $refs; do
            [ "$n" = "$PR_NUMBER" ] && continue
            grep -qx "$n" <<<"$closing" && continue
            info=$(gh api "repos/${REPO}/issues/${n}" -q '[(has("pull_request")|tostring), .state]|join(" ")' 2>/dev/null) \
              || { out "- #${n}: not found, skipped"; continue; }
            [ "${info%% *}" = "true" ] && { out "- #${n}: is a PR, skipped"; continue; }
            n_ref=$((n_ref+1))
            if gh api -X POST "repos/${REPO}/issues/${n}/comments" -f body="Referenced by ${PR_URL}, merged into \`${BASE_REF}\` as ${MERGE_SHA}." >/dev/null; then
              ok "#${n}: commented"
            else
              bad "#${n}: comment failed"
            fi
          done
          [ -z "$closing" ] && [ "$n_ref" -eq 0 ] && out "- no issue referenced"

          # ---------- Branch ----------
          out "### Branch"
          if [ "${DO_DELETE}" != "true" ]; then
            out "- skipped (delete_branch: false)"
          elif [ "$HEAD_REPO" != "$REPO" ]; then
            out "- head is in ${HEAD_REPO} (fork), not deleted"
          elif ! gh api "repos/${REPO}/git/ref/heads/${HEAD_REF}" >/dev/null 2>&1; then
            ok "\`${HEAD_REF}\` already deleted"
          else
            deps=$(gh api "repos/${REPO}/pulls?state=open&base=${HEAD_REF}" -q 'map("#\(.number)")|join(" ")' 2>/dev/null || echo "?")
            # This lookup is not otherwise recorded in `fail`. With errexit off,
            # an API error must still fail the job and must not delete the branch.
            if ! default=$(gh api "repos/${REPO}" -q .default_branch); then
              bad "could not read default branch of ${REPO}"
            elif [ "$HEAD_REF" = "$default" ]; then
              out "- \`${HEAD_REF}\` is the default branch, not deleted"
            elif [ -n "$deps" ]; then
              out "- ⚠️ \`${HEAD_REF}\` kept: open PRs target it (${deps})"
            elif gh api -X DELETE "repos/${REPO}/git/refs/heads/${HEAD_REF}" >/dev/null 2>&1 \
                 || ! gh api "repos/${REPO}/git/ref/heads/${HEAD_REF}" >/dev/null 2>&1; then
              ok "\`${HEAD_REF}\` deleted"
            else
              bad "could not delete \`${HEAD_REF}\` (protected?)"
            fi
          fi

          exit $fail
